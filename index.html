<!DOCTYPE html>
<html lang = 'en'>

<head>
    <link rel='stylesheet' href='style.css'>
    <title>The counter app</title>
    <style>
            .box{
                border:1px solid black;
                height: 100px;
                width: 200px;
                background-color: green;
                margin: 25px;

            }

            .box-container{
                height: 200px;
                width: 100%;
                border: 2px solid red;
                display: grid;
                grid-template-columns: repeat(3, 1fr);
            }
    </style>
</head>

<body>

    <div>
        hello
    </div>

    <div class="box-container">
        <div class="box">1st box</div>
        <div class="box">2st box</div>
        <div class="box">3st box</div>

    </div>
</body>




</html>
